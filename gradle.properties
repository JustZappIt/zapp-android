# Speed up builds.  Keep these flags here for quick debugging of issues.
org.gradle.caching=true
org.gradle.configureondemand=false
# We use increased amount of heap size here to bypass the OOM exception while building the project with ./gradlew
# build as described in https://github.com/Electric-Coin-Company/kotlin-bip39/issues/201
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g
org.gradle.parallel=true
org.gradle.vfs.watch=true

kotlin.mpp.stability.nowarn=true

android.builder.sdkDownload=true
android.nonTransitiveRClass=false
android.useAndroidX=true

# Enable Kotlin metadata version check for script compilation
org.gradle.kotlin.dsl.skipMetadataVersionCheck=false

# Kotlin compiler warnings can be considered errors, failing the build.
ZCASH_IS_TREAT_WARNINGS_AS_ERRORS=true

# Optionally configure coverage for Kotlin modules (e.g. with Kover)
IS_KOTLIN_TEST_COVERAGE_ENABLED=true

# Optionally configure Android instumentation test coverage.
# The app module will crash at launch when coverage is enabled, so coverage is only enabled explicitly for tests.
# generation of instrumentation coverage is flaky, particularly when running ui-lib:connectedCheck
# TODO: [#705] Instrumentation coverage generation fails when run locally
# TODO: [#705] https://github.com/Electric-Coin-Company/zashi-android/issues/705
IS_ANDROID_INSTRUMENTATION_TEST_COVERAGE_ENABLED=false

# Optionally configure test orchestrator.
# It is disabled by default, because it causes tests to take about 2x longer to run.
IS_USE_TEST_ORCHESTRATOR=false

# Optionally enable crashes for strict mode violations in debug builds.
# It is disabled by default, because it can be annoying when debugging. Gets turned on by CI jobs that need it.
IS_CRASH_ON_STRICT_MODE_VIOLATION=false

IS_ENABLE_COMPOSE_COMPILER_METRICS=true
IS_ENABLE_COMPOSE_COMPILER_REPORTS=true

# Either provide a path to a Firebase Test Lab service key (best for CI)
# OR
# login with `./gradlew flankAuth` and provide the project name (best for local development)
ZCASH_FIREBASE_TEST_LAB_API_KEY_PATH=
ZCASH_FIREBASE_TEST_LAB_PROJECT=

# Optionally disable minification
IS_MINIFY_ENABLED=true

# Optionally change the NDK debug symbols generation level
# Supported values are:
# - none (default, no native debug metadata will be packaged)
# - symbol_table (only the symbol tables will be packaged)
# - full (the debug info and symbol tables will be packaged)
# The result will be placed in app/build/outputs/native-debug-symbols/variant-name/native-debug-symbols.zip
NDK_DEBUG_SYMBOL_LEVEL=symbol_table

# If ZCASH_GOOGLE_PLAY_SERVICE_KEY_FILE_PATH is set and the deployment task is triggered, then
# VERSION_CODE is effectively ignored. VERSION_NAME is suffixed with the version code.
# If not using automated Google Play deployment, then these serve as the actual version numbers.
ZCASH_VERSION_CODE=1
ZCASH_VERSION_NAME=4.4.0

# Select which Zcash network variants are built. Leave blank to enable both mainnet and
# testnet flavors (default, matches CI behavior). Set to `mainnet` or `testnet` to disable
# the other network's variants, so `./gradlew :app:assembleDebug` resolves to a single
# variant. Can also be overridden per-invocation with `-PZCASH_NETWORK=testnet` or via the
# `ORG_GRADLE_PROJECT_ZCASH_NETWORK` environment variable.
ZCASH_NETWORK=

# Blind peer public key (z32). Safe to commit — public key only, not a secret.
# The zappmessaging build.gradle.kts falls through: local.properties → here → env var → "".
BLIND_PEER_KEYS=5ccrwsgqfg1hawwcbckmisww4sy3qns5scsntxfztgx7pt4eps5o
# Custom DHT bootstrap node — the blind peer's VPS (host:port).
# Appended to the default Holepunch bootstrap list so fresh installs seed the routing
# table with a node that already knows the blind peer's announce record.
BLIND_PEER_BOOTSTRAP=140.245.193.100:49737
# Stable public blind-peer endpoint. Passed separately from the bootstrap list so
# HyperDHT can attempt the server immediately and retain normal lookup fallback.
BLIND_PEER_ADDRESS=140.245.193.100:49737
# Self-hosted ntfy base URL for the embedded chat push doorbell. Public value, safe to commit.
NTFY_BASE_URL=https://ntfy.140.245.193.100.sslip.io
# Bootstrap invite mailbox over HTTPS, for networks that drop HyperDHT's UDP. Also
# the allow-list for host-carried requests: the worklet cannot ask the app to POST
# anywhere outside this prefix. Caddy must strip the path prefix — see
# docs/notifications/deployment/blind-push/README.md. Public value, safe to commit.
INVITE_MAILBOX_URL=https://ntfy.140.245.193.100.sslip.io/zapp-invite
# UPI offramp (p2p.me) — network + endpoints. Override per-developer in local.properties.
# Network: 'sepolia' (default) or 'mainnet'. Selects which preset in offramp-lib's P2pNetworks
# is wired into the OfframpOrchestrator at runtime. Keep blank in committed defaults so CI
# builds (which lack local.properties) don't accidentally pick a network.
P2P_NETWORK=
# Base URL of the Zapp onramp service that owns the reputation-bearing operator account and
# places every BUY. A public endpoint, so it is safe to commit. Blank hides the entry point.
P2P_ONRAMP_BASE_URL=https://onramp.zecname.xyz
# Debug-only: drive the onramp screens off FakeOnrampDriver instead of the network. Ignored in
# release builds. Override in local.properties.
P2P_ONRAMP_USE_FAKE_DRIVER=false
# Controls new automatic ZEC deliveries. Existing delivery checkpoints continue recovery when disabled.
P2P_ONRAMP_AUTO_ZEC_ENABLED=false
# RPC endpoints — Alchemy/Infura URLs embed an API key in the path, so the committed default
# must be blank. Set per-developer in local.properties (or via ORG_GRADLE_PROJECT_* env var).
P2P_RPC_URL_BASE_SEPOLIA=
P2P_RPC_URL_BASE_MAINNET=
# Subgraph URLs. Both go through Graph Gateway with an embedded API key — keep blank in
# committed defaults; set the real value in local.properties.
P2P_SUBGRAPH_URL_SEPOLIA=
P2P_SUBGRAPH_URL_MAINNET=
# Pimlico API key for the offramp ERC-4337 bundler + verifying paymaster (account abstraction).
# Treat as a secret — Pimlico's key is not frontend-safe; keep blank in committed defaults and set
# the real value in local.properties (or via ORG_GRADLE_PROJECT_PIMLICO_API_KEY env var). The key
# authenticates both bundler RPC and sponsorship credits, so a leak lets others spend on your tab.
PIMLICO_API_KEY=
# Optional Pimlico ERC-7677 sponsorship policy id. When set, pm_sponsorUserOperation is scoped
# to this specific policy — configure a policy in the Pimlico dashboard restricting the
# (target contract, function selector, sender, amount) tuple to just what the offramp flow uses.
# That way a stolen-from-APK API key can only sponsor expected calls, not arbitrary contracts.
# Blank → falls back to the project's default sponsorship rules (fine for dev, risky for mainnet).
PIMLICO_SPONSORSHIP_POLICY_ID=

# When true, the offramp signs with a hardcoded dev EVM key (DevOfframpAccountProvider) — every
# install shares one smart-account address, useful for stable testnet QA. When false (production),
# the owner is derived from the user's wallet seed → per-user smart account. Defaults safe.
OFFRAMP_USE_DEV_KEY=false

# zappMessaging worklet log level: 'debug' | 'info' | 'warn' | 'error' | 'off'.
# Empty = JS-side default ('info'). 'debug' enables verbose stream lifecycle,
# probe results, and keypair dumps in blind-mirror & p2p-manager diag logs.
ZAPP_MESSAGING_LOG_LEVEL=

# Set these fields, as you need them (e.g. with values "Zcash X" and "co.electriccoin.zcash.x")
# to distinguish a different release build that can be installed alongside the official version
# available on Google Play. This is useful for testing, or for a forked version of the app.
ZCASH_RELEASE_APP_NAME=Zapp
ZCASH_RELEASE_PACKAGE_NAME=xyz.justzappit.zapp
ZCASH_DEBUG_APP_NAME_SUFFIX="Debug"
ZCASH_FOSS_APP_NAME_SUFFIX="Foss"
ZCASH_INTERNAL_APP_NAME_SUFFIX="Internal"

# Recommended protection of screens with sensitive data.
# It is enabled by default to protect the developers from revealing their wallet secrets by mistake.
IS_SECURE_SCREEN_PROTECTION_ACTIVE=true
# Set whether the screen rotation is enabled or the screen orientation is locked in the portrait mode.
IS_SCREEN_ROTATION_ENABLED=false

# Set the flexa publishable key to setup local integration. Replaced by CI action.
ZCASH_FLEXA_KEY=

# Set CMC publishable key to setup local integration. Replaced by CI action.
ZCASH_CMC_KEY=

# Set keystore details to enable build signing.  Typically these
# are overridden via ~/.gradle/gradle.properties to allow secure injection.
# Debug keystore is useful if using Google Maps or Firebase, which require API keys to be linked
# to a signing key. Without a debug keystore, the default Android debug keystore will be used.
# Without a release signing configuration, the release output will not be signed.
ZCASH_DEBUG_KEYSTORE_PATH=
ZCASH_RELEASE_KEYSTORE_PATH=
ZCASH_RELEASE_KEYSTORE_PASSWORD=
ZCASH_RELEASE_KEY_ALIAS=
ZCASH_RELEASE_KEY_ALIAS_PASSWORD=

# Switch this property to true only if you need to sign the release build with a debug key. It can
# be useful, for example, for running benchmark tests against a release build of the app signed with
# the default debug key configuration.
IS_SIGN_RELEASE_BUILD_WITH_DEBUG_KEY=false
# Switch this property to true only if you need the release build to be debuggable. It can be helpful, for example,
# for logging or debugging minified release app build.
IS_RELEASE_BUILD_DEBUGGABLE=false

# Set the Google Play Service Account email address to enable deployment
# Note that this property is not currently used due to #1033
# TODO [#1033]: Use token-based authorization on Google Play for automated deployment
# TODO [#1033]: https://github.com/Electric-Coin-Company/zashi-android/issues/1033
ZCASH_GOOGLE_PLAY_SERVICE_ACCOUNT=
# Also, set the Google Play Service Key path to enable deployment. It's a path to the private key file (only used for
# Service Account auth).
# Note that this property is not currently used due to #1033
# TODO [#1033]: Use token-based authorization on Google Play for automated deployment
# TODO [#1033]: https://github.com/Electric-Coin-Company/zashi-android/issues/1033
ZCASH_GOOGLE_PLAY_SERVICE_KEY_FILE_PATH=
# Set the Google Play Service Account key to authorize on Google Play
ZCASH_GOOGLE_PLAY_SERVICE_ACCOUNT_KEY=
# Set the Google Play Publisher API key to authorize the publisher on Google Play API
ZCASH_GOOGLE_PLAY_PUBLISHER_API_KEY=
# Can be one of {internal, alpha}. There are more of them {beta, production}, which are not supported for security
# reasons. Internal will deploy into the Internal and Alpha into the Closed testing tracks on Google Play.
ZCASH_GOOGLE_PLAY_DEPLOY_TRACK=internal
# Can be one of {draft, completed}.
# Draft can be used to generate a version number for the next release, but does not ultimately create a release on
# Google Play. Completed commits the build on Google Play, creating a new release.
ZCASH_GOOGLE_PLAY_DEPLOY_STATUS=draft

ZCASH_EMULATOR_WTF_API_KEY=

# Optional absolute path to a Zcash SDK checkout.
# When blank, it pulls the SDK from Maven.
# When set, it uses the path for a Gradle included build.  Path can either be absolute or relative to the root of this app's Gradle project.
SDK_INCLUDED_BUILD_PATH=
# The commit on zcash/zcash-android-wallet-sdk that upstream zodl builds its 3.1.0 line against
# (upstream maint/v3.10.x sets the same value). Nothing in this repo reads it: it is the record of
# which SDK tree a release is supposed to be built from, and it is deliberately not wired into CI.
#
# It matters because ZCASH_SDK_VERSION below is a -SNAPSHOT, and a snapshot is mutable. Maven has
# published exactly one 3.1.0 build (3.1.0-20260820.161424-1, 2026-08-20), while this pin is from
# 2026-08-24 — so CI, which resolves the snapshot, is NOT building the same SDK tree as a release
# built against this pin. The gap is nine SDK commits, all Orchard-migration/Keystone work
# (MOB-1750, MOB-1723, MOB-1760); no voting change is in it.
#
# To build a release against this pin, check the SDK out at this commit and point Gradle at it:
#   git -C <sdk> checkout 0ef67b411f0a51aae00346fef18286505e1bcfd1
#   ORG_GRADLE_PROJECT_SDK_INCLUDED_BUILD_PATH=<sdk> ./gradlew :app:bundleZcashmainnetStoreRelease
# Gradle logs "The SDK will be used from ... instead of Maven Central." when that took effect; no
# such line means the build silently used the published snapshot instead.
SDK_COMMIT_PIN=0ef67b411f0a51aae00346fef18286505e1bcfd1

# When blank, it pulls the BIP-39 library from Maven.
# When set, it uses the path for a Gradle included build.  Path can either be absolute or relative to the root of this app's Gradle project.
BIP_39_INCLUDED_BUILD_PATH=

